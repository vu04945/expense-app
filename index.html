<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEFEE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>記帳</title>
<style>
:root{
  --bg:#ECEFEE; --ink:#000; --sub:#6e7473; --line:#000; --hair:rgba(0,0,0,.16);
  --accent:#EDB299; --neg:#c2603a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --ink:#fff; --sub:#9a9f9e; --line:#fff; --hair:rgba(255,255,255,.22); --neg:#EDB299; }
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/24px "Helvetica Neue","Neue Haas Grotesk Text Pro",Helvetica,Arial,"PingFang TC","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding:0 16px calc(72px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
header{display:flex;align-items:baseline;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 0 24px}
h1{font-size:16px;font-weight:400;margin:0}
#sync{border:0;background:none;color:var(--sub);padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#sync.pending{background:var(--accent);color:#000;text-decoration:none}
strong{font-weight:400;border-bottom:1px solid var(--line)}
.card{background:transparent;border:0;border-top:1px solid var(--line);padding:16px 0 24px;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:16px;margin-bottom:8px}
.seg button{border:0;border-bottom:1px solid var(--hair);background:none;color:var(--sub);
  text-align:left;padding:8px 0;cursor:pointer}
.seg button.on{color:var(--ink);border-bottom:2px solid var(--ink)}
.chip,.preset{border:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 12px;cursor:pointer}
.chip.on{background:var(--accent);color:#000}
.chips,.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets{margin-bottom:8px}
.preset{font-size:14px;padding:2px 10px}
label{display:block;font-size:14px;color:var(--sub);margin:20px 0 4px}
input,select{width:100%;max-width:100%;min-width:0;font:inherit;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:10px 0;-webkit-appearance:none;appearance:none;outline:none}
input:focus,select:focus{border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
input[type=date]{display:block;min-height:44px;text-align:left}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 8px) 50%,calc(100% - 2px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:24px}
#amount{font-size:64px;line-height:72px;font-weight:300;letter-spacing:-0.02em;text-align:left;padding:4px 0 8px}
#amount::placeholder{color:var(--hair)}
.save{width:100%;margin-top:28px;background:var(--ink);color:var(--bg);border:0;padding:16px;text-align:left;cursor:pointer}
.save:active{background:var(--accent);color:#000}
.btn2{border:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 12px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row small{color:var(--sub);font-size:14px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.neg{color:var(--neg)}
.muted{color:var(--sub);font-size:14px}
.del{font:inherit;font-size:14px;color:var(--sub);background:none;border:0;padding:0 0 0 8px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto}
nav button{background:none;border:0;color:var(--sub);text-align:left;padding:0;cursor:pointer}
nav button.on{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
section{display:none}
section.on{display:block}
#toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;
  background:var(--ink);color:var(--bg);padding:10px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>記帳</h1>
  <button id="sync" type="button">已同步</button>
</header>

<section id="tab-add" class="on">
  <div class="seg" id="typeSeg">
    <button data-t="expense" class="on">支出</button>
    <button data-t="income">收入</button>
    <button data-t="transfer">轉帳</button>
  </div>
  <div class="card">
    <input id="amount" type="number" inputmode="decimal" placeholder="0" min="0" step="any" aria-label="金額">
    <div id="presetBox" style="display:none">
      <label>常用轉帳</label>
      <div class="presets" id="presets"></div>
    </div>
    <div id="catBox">
      <label>類別</label>
      <div class="chips" id="cats"></div>
    </div>
    <label id="acctLabel">付款帳戶</label>
    <select id="acct"></select>
    <div id="toBox" style="display:none">
      <label>轉入帳戶</label>
      <select id="toAcct"></select>
    </div>
    <label>日期(轉帳、買賣股票請填結算日)</label>
    <input id="date" type="date">
    <label>備註(選填)</label>
    <input id="note" type="text" placeholder="例如:午餐、零股買進">
    <button class="save" id="save">記下來 →</button>
  </div>
  <div class="card">
    <strong>最近 5 筆</strong>
    <div id="recent"></div>
  </div>
</section>

<section id="tab-month">
  <div class="card">
    <div class="row"><strong id="monthTitle"></strong>
      <span><button class="btn2" id="prevM">‹</button> <button class="btn2" id="nextM">›</button></span></div>
    <div class="row"><span>生活支出</span><span class="num" id="mExp"></span></div>
    <div class="row"><span>收入(不含股利)</span><span class="num" id="mInc"></span></div>
    <div class="row"><span>股利</span><span class="num" id="mDiv"></span></div>
    <div class="row"><span>投資成本(手續費、證交稅)</span><span class="num" id="mInvCost"></span></div>
    <div class="row"><span>轉入證券戶(淨)</span><span class="num" id="mInvNet"></span></div>
  </div>
  <div class="card">
    <strong>生活支出分類</strong>
    <div id="mCats"></div>
  </div>
  <p class="muted">轉帳(提款、儲值、繳卡費、買賣股票)不算消費。投資成本與股利不計入生活支出。</p>
</section>

<section id="tab-acct">
  <div class="card">
    <strong>生活現金</strong>
    <div id="lifeList"></div>
    <div class="row"><strong>合計</strong><strong class="num" id="lifeTotal"></strong></div>
  </div>
  <div class="card">
    <strong>投資部位</strong>
    <div id="invList"></div>
    <p class="muted">這裡只記資金進出證券戶,不含股票市值。持股與損益以 holdings.json 為準。</p>
  </div>
  <p class="muted">對帳:實際點一次現金或看 App 餘額,輸入後,差額會記成「未記錄支出」或「對帳差額」。</p>
</section>

<section id="tab-set">
  <div class="card">
    <label>同步網址(Apps Script 網頁應用程式 URL)</label>
    <input id="setUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>密鑰(只存在這支手機)</label>
    <input id="setToken" type="password" autocomplete="off">
    <button class="save" id="saveSet">儲存設定</button>
    <button class="btn2" id="syncNow" style="margin-top:10px;width:100%">立即同步</button>
  </div>
  <div class="card">
    <strong>帳戶管理</strong>
    <p class="muted">可改名稱、新增或刪除(沒有紀錄的才能刪)。改名只影響之後同步到試算表的名稱。</p>
    <div id="acctMgr"></div>
    <label>新增帳戶</label>
    <input id="newName" type="text" placeholder="例如:悠遊卡、玉山銀行">
    <label>類型</label>
    <select id="newKind"></select>
    <button class="btn2" id="addAcct" style="width:100%;margin-top:10px">新增</button>
  </div>
  <div class="card">
    <strong>帳戶期初餘額</strong>
    <p class="muted">只填一次。信用卡填目前欠款(正數)。</p>
    <div id="openList"></div>
    <button class="btn2" id="saveOpen" style="width:100%;margin-top:10px">儲存期初餘額</button>
  </div>
  <p class="muted" id="storageNote"></p>
</section>

<nav id="nav">
  <button data-tab="add" class="on">記一筆</button>
  <button data-tab="month">本月</button>
  <button data-tab="acct">帳戶</button>
  <button data-tab="set">設定</button>
</nav>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
